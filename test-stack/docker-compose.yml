services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
    volumes:
      - redmine_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "redmine"]
      interval: 5s
      timeout: 5s
      retries: 20

  redmine:
    image: redmine:5.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "13080:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_SECRET_KEY_BASE: dev-secret-do-not-use-in-prod
    volumes:
      - redmine_files:/usr/src/redmine/files

volumes:
  redmine_db:
  redmine_files:
